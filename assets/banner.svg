      <stop offset="0" stop-color="#173f32"/>
      <stop offset="1" stop-color="#285d49"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf2df"/>
      <stop offset="1" stop-color="#b6ddc1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102e24" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1140" cy="25" r="260" fill="#5d9877" opacity=".16"/>
